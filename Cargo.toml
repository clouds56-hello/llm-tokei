[package]
name = "llm-tokei"
version = "0.1.15"
edition = "2021"
description = "Token usage stats CLI for local coding-agent sessions"
license = "MIT"
repository = "https://github.com/agentic-rs/llm-tokei"
homepage = "https://agentic-rs.github.io/llm-tokei/"
documentation = "https://docs.rs/llm-tokei"
readme = "README.md"
exclude = [
  "/.github/**",
  "/schemas/**",
  "/site/**",
  "/target/**",
  "/tests/fixtures/**"
]
keywords = ["llm", "tokens", "cli", "codex", "opencode"]
categories = ["command-line-utilities"]

[[bin]]
name = "llm-tokei"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "1"
ureq = { version = "3.3", features = ["json"] }
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
blake3 = "1"
sha2 = "0.10"
flate2 = "1"
zstd = "0.13"
walkdir = "2"
glob = "0.3"
humantime = "2"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
terminal_size = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokn-codex-protocol = "0.1.0"
tokn-opencode-protocol = "0.1.0"
tokn-pi-protocol = "0.1.0"

[[example]]
name = "gen-showcase"
path = "examples/gen-showcase.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
